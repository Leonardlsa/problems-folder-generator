[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuotiji-generator"
version = "3.0.0"
description = "错题集生成器 - 自动化生成学生错题集的工具"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Leonard", email = "leonard@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
]

[project.scripts]
cuotiji = "main:main"

[project.gui-scripts]
cuotiji-gui = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["ui", "core.py", "main.py"]
