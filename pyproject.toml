[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuotiji-generator"
version = "3.1.0"
description = "错题集生成器 - 一次生成每名学生的学生版和教师版"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Leonard", email = "leonard@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cuotiji = "main:main"

[project.gui-scripts]
cuotiji-gui = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["ui"]

[tool.hatch.build.targets.wheel.force-include]
"core.py" = "core.py"
"main.py" = "main.py"
"version.py" = "version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
